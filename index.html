function escapeHtml(s){
 return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function build(){
 scenesEl.innerHTML=scenes.map((_,i)=>render(i)).join("");
 const all=[...scenesEl.querySelectorAll(".scene")];
 all.forEach((s,i)=>{s.classList.toggle("active",i===0);s.style.visibility=i===0?"visible":"hidden";s.style.opacity=i===0?"1":"0"});
 progress.innerHTML=scenes.map((_,i)=>`<span class="dot${i===0?" active":""}"></span>`).join("");
}
build();

function playTone(freq=520,dur=.12){
  if(!soundOn)return;
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended')audioCtx.resume(); const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.frequency.value=freq; g.gain.setValueAtTime(.0001,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.025,audioCtx.currentTime+.02); g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur); o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur+.02);}catch(e){}
}
function confetti(){
  const host=document.getElementById('app');
  for(let i=0;i<28;i++){const el=document.createElement('span');el.textContent=['✦','·','♥','✧'][i%4];el.style.cssText=`position:absolute;z-index:90;left:50%;top:50%;pointer-events:none;color:${i%3===0?'#ffd98a':i%3===1?'#ff86ad':'#b9a6ff'};font-size:${8+Math.random()*16}px`;host.appendChild(el);const x=(Math.random()-.5)*innerWidth*1.15,y=(Math.random()-.5)*innerHeight*1.05;el.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:`translate(${x}px,${y}px) rotate(${Math.random()*500}deg)`,opacity:0}],{duration:1200+Math.random()*500,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>el.remove();}
}
function animateScene(s){
  if(!s)return;
  s.classList.add('active');s.style.visibility='visible';s.style.opacity='1';
  const items=s.querySelectorAll('.eyebrow,.headline,.display,.lead,.subline,.cta,.photo-stage,.photo-row,.map,.big-word,.memory-info,.stack,.archive-grid,.letter-card,.final-grid,.highlight-box,.warning');
  const photos=s.querySelectorAll('.photo-frame,.photo-card,.photo-tile,.stack-card');
  items.forEach((el,i)=>{el.style.opacity='0';el.style.transform='translateY(20px) scale(.985)';el.style.transition=`opacity .55s ease ${Math.min(i,10)*45}ms,transform .55s ease ${Math.min(i,10)*45}ms`;requestAnimationFrame(()=>{el.style.opacity='1';el.style.transform='translateY(0) scale(1)';});});
  photos.forEach((el,i)=>{el.style.opacity='0';el.style.filter='blur(7px)';el.style.transition=`opacity .7s ease ${180+i*55}ms,filter .7s ease ${180+i*55}ms`;requestAnimationFrame(()=>{el.style.opacity='1';el.style.filter='blur(0)';});});
  if(['3','10','12','19'].includes(s.dataset.index))setTimeout(confetti,350);
  if(s.dataset.index==='13')setupBond(s);
  if(s.dataset.index==='15')setupMuseum(s);
  if(s.dataset.index==='17')setupArchive(s);
  if(s.dataset.index==='20')setTimeout(explodeFinal,500);
}
function updateNav(){
  navCount.textContent=String(current+1).padStart(2,'0')+' / '+sceneEls.length;
  dots.forEach((d,i)=>d.classList.toggle('active',i===current));
  document.getElementById('prevBtn').style.visibility=current===0?'hidden':'visible';
  document.getElementById('nextBtn').style.visibility=current===sceneEls.length-1?'hidden':'visible';
}
function show(nextIndex){
  const next=((nextIndex%sceneEls.length)+sceneEls.length)%sceneEls.length;
  if(next===current){animateScene(sceneEls[current]);return;}
  const prev=sceneEls[current], target=sceneEls[next];
  prev.classList.remove('active');prev.style.visibility='hidden';prev.style.opacity='0';
  target.classList.add('active');target.style.visibility='visible';target.style.opacity='0';
  current=next;updateNav();
  requestAnimationFrame(()=>{target.style.opacity='1';animateScene(target);});
  playTone(current%2?560:680,.1);
}
function goNext(){show(current+1)}
function goPrev(){show(current-1)}
function reset(){current=0;memoryIndex=0;sceneEls.forEach((s,i)=>{s.classList.toggle('active',i===0);s.style.visibility=i===0?'visible':'hidden';s.style.opacity=i===0?'1':'0'});updateNav();animateScene(sceneEls[0]);playTone(660,.12)}
function setupBond(scene){
 const w=scene.querySelector('#distanceWord'); if(!w||w.dataset.bound)return; w.dataset.bound='1';
 w.addEventListener('click',()=>{const on=w.classList.toggle('bond');w.classList.toggle('outline',!on);w.textContent=on?'BOND':'DISTANCE';scene.querySelector('#bondText').innerHTML=on?'Distance came between us.<br><strong>But never between our bond.</strong>':'Distance came between us.';scene.querySelector('#bondSmall').textContent=on?'0% distance in our friendship. 🫶🏻🧿✨':'Tap it. 👆🏻';playTone(on?760:420,.15);if(on)confetti();});
}
function setupMuseum(scene){
 const stack=scene.querySelector('#memoryStack'),count=scene.querySelector('#memoryCount'),caption=scene.querySelector('#memoryCaption');if(!stack||stack.dataset.bound)return;stack.dataset.bound='1';
 const captions=['One little piece of our chaos archive.','A moment worth keeping.','Another page in our friendship.','Still us. Still the same.','A memory that survived the distance.'];
 function draw(){const ids=[memoryIndex%18,(memoryIndex+1)%18,(memoryIndex+2)%18];stack.innerHTML=ids.map((id,j)=>`<div class="stack-card" style="z-index:${3-j};transform:rotate(${[-7,4,-1][j]}deg) translate(${[-10,8,0][j]}px,${[10,-5,0][j]}px)">${img(id+1)}</div>`).join('');count.textContent=`MEMORY ${String(memoryIndex+1).padStart(2,'0')} / 18`;caption.textContent=captions[memoryIndex%captions.length];}
 function pop(){memoryIndex=(memoryIndex+1)%18;draw();playTone(590,.08)}
 scene.querySelector('[data-action="memory"]')?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();pop()});stack.addEventListener('click',e=>{e.stopPropagation();pop()});draw();
}
function setupArchive(scene){
 const open=scene.querySelector('[data-action="archive"]');if(open&&!open.dataset.bound){open.dataset.bound='1';open.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();scene.querySelectorAll('.archive-card').forEach((c,i)=>setTimeout(()=>c.classList.add('open'),i*90));playTone(720,.13);});}
 scene.querySelectorAll('.archive-card').forEach(c=>{if(c.dataset.bound)return;c.dataset.bound='1';c.addEventListener('click',e=>{e.stopPropagation();c.classList.toggle('open');playTone(480,.08)})});
}
function explodeFinal(){const grid=document.getElementById('finalGrid');if(!grid||grid.dataset.exploded)return;grid.dataset.exploded='1';const imgs=[...grid.querySelectorAll('img')],w=grid.clientWidth,h=grid.clientHeight,cx=w/2,cy=h/2;imgs.forEach((im,i)=>{const a=(i/imgs.length)*Math.PI*2,r=Math.min(w,h)*(.27+.08*(i%3));im.style.left=(cx+r*Math.cos(a)-55)+'px';im.style.top=(cy+r*Math.sin(a)-78)+'px';im.style.transform=`rotate(${(i%2?-1:1)*(8+i%5)}deg) scale(.55)`;setTimeout(()=>{im.style.opacity='1';im.style.transform=`rotate(${(i%2?-1:1)*(8+i%5)}deg) scale(1)`},i*45)});}

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;
 const a=b.dataset.action;
 if(a==='next'){e.preventDefault();e.stopPropagation();goNext();}
 else if(a==='replay'){e.preventDefault();e.stopPropagation();reset();}
 // memory/archive/bond have their own listeners; deliberately do not navigate here.
});
document.getElementById('nextBtn').addEventListener('click',goNext);
document.getElementById('prevBtn').addEventListener('click',goPrev);
document.getElementById('homeBtn').addEventListener('click',reset);
document.getElementById('soundBtn').addEventListener('click',()=>{soundOn=!soundOn;document.getElementById('soundBtn').style.opacity=soundOn?'1':'.48'});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();goNext()}else if(e.key==='ArrowLeft'){e.preventDefault();goPrev()}});
let touchX=0;document.addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>75)show(current+(dx<0?1:-1))},{passive:true});
updateNav();animateScene(sceneEls[0]);
</script>
</body>
</html>
